[project]
name = "zotero-writes"
version = "0.1.0"
description = "The one gated write path for Adam's local Zotero library: liveness checked, keys resolved before sending, no-ops refused, every change journalled with its inverse."
# Matches core's floor. The dependency runs writes -> core, so this cannot be
# looser than what core supports.
requires-python = ">=3.10"
# `zotero_context` supplies the READS the gates need. Nothing else: the transport is
# stdlib urllib, so this package adds no third-party dependency to the suite.
dependencies = [
    "zotero-context",
]

[project.optional-dependencies]
mcp = [
  # <2 deliberately, and the SAME pin as core. mcp 2.0.0 removed the
  # `@server.list_tools()` decorator and `mcp.server.fastmcp`, so an unpinned
  # `>=1.26.0` resolves 2.0.0 and the adapter dies at import with `'Server' object has
  # no attribute 'list_tools'`. That is how core's adapter sat broken long enough never
  # to be registered. Revisit only by porting `mcp_server.py`.
  "mcp>=1.26.0,<2",
]

[project.scripts]
# The adapter only. There is no `zotero-writes` CLI: a write is not something to reach
# for by hand, and the Python API is the surface consumers import.
zotero-writes-mcp = "zotero_writes.mcp_server:run"

[tool.uv.sources]
zotero-context = { path = "../core", editable = true }

[dependency-groups]
# PEP 735 rather than an extra. These are for developing this package, not for
# installing it -- `--extra mcp` is a real runtime capability a consumer opts into,
# while nobody consuming `zotero_writes` wants `import-linter`.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty==0.0.55",  # PINNED EXACTLY: ty is pre-1.0 (0.0.x) and its diagnostics change
                   # between releases, so an unpinned bump turns `just lint` red with no
                   # code change. Same pin as omni-rag and the other siblings.
    "import-linter>=2.9",
    "vulture>=2.14",
    "codespell>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Same rule set as calibre-core and the rest of Adam's Python: pycodestyle +
# pyflakes, import order, bugbear, pyupgrade, complexity ceiling.
select = ["E", "F", "I", "B", "UP", "C901"]

[tool.ruff.lint.isort]
# `zotero_context` is a sibling package in this repo reached through a path
# dependency, not a third-party distribution. Grouping it next to pytest would
# misrepresent the layout and hide the one dependency edge that matters here:
# writes -> core, never the reverse.
known-first-party = ["zotero_writes", "zotero_context"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
