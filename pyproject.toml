[project]
name = "zotero-context"
version = "0.1.0"
description = "Read-only Python API for local Zotero window state and annotations"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = [
  # <2 deliberately. mcp 2.0.0 is a different API: no `@server.list_tools()`
  # decorator and no `mcp.server.fastmcp`. This adapter targets 1.x, and an
  # unpinned `>=1.0.0` resolved 2.0.0 and crashed the server at import with
  # `'Server' object has no attribute 'list_tools'` — which is why it was never
  # registered and never noticed. calibre-mcp pins the same way for the same
  # reason. Revisit only by porting the adapter.
  "mcp>=1.26.0,<2",
]

[project.scripts]
zotero-context = "zotero_context.cli:main"
zotero-context-mcp = "zotero_context.mcp_server:run"

[dependency-groups]
# PEP 735, not extras: `--extra mcp` is a runtime capability a consumer opts into, while
# nobody consuming `zotero_context` wants a type checker. Matches writes/ and the
# sibling repos.
dev = [
    "ruff>=0.6",
    "ty==0.0.55",  # PINNED EXACTLY: ty is pre-1.0 (0.0.x) and its diagnostics change
                   # between releases, so an unpinned bump turns `just lint` red with no
                   # code change. Bump deliberately, both packages together.
    "vulture>=2.14",
    "codespell>=2.4",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Same rule set as writes/, calibre-core and the rest of Adam's Python: pycodestyle +
# pyflakes, import order, bugbear, pyupgrade, complexity ceiling.
select = ["E", "F", "I", "B", "UP", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["zotero_context"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
